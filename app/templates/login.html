{% extends "base.html" %}
{% block content %}
<div class="max-w-md mx-auto bg-white p-6 rounded-xl shadow">
    <h1 class="text-xl font-bold mb-4">Login</h1>
    {% if error %}
    <p class="text-red-600 text-sm mb-2">{{ error }}</p>
    {% endif %}
    <form method="post" class="space-y-4">
        <div>
            <label class="block text-sm font-medium mb-1">Username</label>
            <input name="username" type="text" required class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <div>
            <label class="block text-sm font-medium mb-1">Password</label>
            <input name="password" type="password" required class="w-full border rounded px-3 py-2 text-sm">
        </div>
        <button class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded text-sm">
            Login
        </button>
    </form>
</div>
{% endblock %}
